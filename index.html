<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><title>Control de Horarios · Acceso</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#152b42;background:#f2f6fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.panel{width:min(100%,460px);background:#fff;border:1px solid #dae4ef;border-radius:20px;padding:32px;box-shadow:0 14px 45px #172c4412}h1{font-size:1.55rem;margin:0 0 8px}p{line-height:1.5;color:#52647a}.small{font-size:.88rem}label{display:block;margin:16px 0 7px;font-weight:600}input{width:100%;border:1px solid #b7c8d9;border-radius:10px;padding:13px;font-size:16px}button{width:100%;border:0;border-radius:10px;background:#194e85;color:white;font-weight:700;padding:13px;margin-top:17px;cursor:pointer}button.secondary{background:#e9f1f9;color:#194e85}button:disabled{opacity:.5}#status{min-height:2em;overflow-wrap:anywhere}#passwordBox,#signedIn{display:none}.foot{font-size:.8rem;margin-top:22px}
</style></head><body><main class="panel"><h1>Control de Horarios</h1><p>Acceso privado · Versión inicial</p><p id="status" role="status" aria-live="polite">Comprobando el enlace…</p>
<section id="login"><form id="loginForm"><label for="email">Correo electrónico</label><input id="email" type="email" autocomplete="username" required value="joseariel.rod26@gmail.com"><label for="loginPassword">Contraseña</label><input id="loginPassword" type="password" autocomplete="current-password" required><button type="submit">Iniciar sesión</button></form></section>
<section id="passwordBox"><form id="passwordForm"><label for="newPassword">Crear contraseña</label><input id="newPassword" type="password" autocomplete="new-password" minlength="12" required><label for="confirmPassword">Confirmar contraseña</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="12" required><button type="submit">Guardar contraseña</button></form></section>
<section id="signedIn"><p>La cuenta está autenticada. El panel de horarios se habilitará después de configurar tu perfil de administrador.</p><button class="secondary" id="logout">Cerrar sesión</button></section>
<p class="foot">No compartas contraseñas ni enlaces de invitación. Esta página no carga todavía documentos laborales.</p></main>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/+esm';
const sb=createClient('https://zuvxvymkfacuamdxcplt.supabase.co','sb_publishable_HuqvLrf1E2s2xdIA6QWrrw_k8Nlzqsl',{auth:{detectSessionInUrl:true,autoRefreshToken:true,persistSession:true}});
const $=id=>document.getElementById(id);let passwordSetup=false;
function status(message){$('status').textContent=message}
function display(mode){$('login').style.display=mode==='login'?'block':'none';$('passwordBox').style.display=mode==='password'?'block':'none';$('signedIn').style.display=mode==='signed'?'block':'none'}
const url=new URL(location.href);const hasAuthLink=location.hash.includes('access_token=')||url.searchParams.has('code');const linkError=url.searchParams.get('error_description')||url.searchParams.get('error');
if(linkError){status('Error de invitación: '+linkError);display('login')}
else {try {const {data,error}=await sb.auth.getSession();if(error)throw error;if(data.session){if(hasAuthLink){passwordSetup=true;display('password');status('Invitación reconocida. Crea una contraseña de al menos 12 caracteres.')}else{display('signed');status('Sesión iniciada correctamente.')}}else{display('login');status(hasAuthLink?'No se pudo completar la invitación. Solicita una invitación nueva.':'Inicia sesión con tu cuenta.')}}catch(e){status('No se pudo validar la sesión: '+e.message);display('login')}}
$('passwordForm').addEventListener('submit',async e=>{e.preventDefault();const a=$('newPassword').value,b=$('confirmPassword').value;if(a!==b){status('Las contraseñas no coinciden.');return}if(a.length<12){status('Utiliza al menos 12 caracteres.');return}const {error}=await sb.auth.updateUser({password:a});if(error){status('No se pudo guardar: '+error.message);return}passwordSetup=false;display('signed');status('Contraseña guardada y sesión iniciada.');$('newPassword').value='';$('confirmPassword').value=''});
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('loginPassword').value});$('loginPassword').value='';if(error){status('No se pudo iniciar sesión: '+error.message);return}display('signed');status('Sesión iniciada correctamente.')});
$('logout').addEventListener('click',async()=>{await sb.auth.signOut();display('login');status('Sesión cerrada.')});
</script></body></html>
